<!doctype html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM Playground & Chat UI</title>
    <link rel="stylesheet" href="style.css" />
    k
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Marked parser for Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Highlight.js for Code Syntax Highlighting -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body
    class="h-full flex flex-col md:flex-row overflow-hidden bg-slate-950 text-slate-100"
  >
    <!-- Settings Drawer / Sidebar -->
    <aside
      id="settingsDrawer"
      class="w-full md:w-80 bg-slate-900 border-r border-slate-800 flex flex-col transition-all duration-300 z-20 flex-shrink-0"
    >
      <!-- Sidebar Header -->
      <div
        class="p-4 border-b border-slate-800 flex items-center justify-between"
      >
        <div class="flex items-center gap-2">
          <div class="p-2 bg-indigo-600/20 text-indigo-400 rounded-lg">
            <i data-lucide="cpu" class="w-5 h-5"></i>
          </div>
          <h1 class="font-semibold text-lg tracking-wide text-slate-100">
            LLM Studio
          </h1>
        </div>
        <button
          id="toggleSidebarMobile"
          class="md:hidden p-2 text-slate-400 hover:text-white"
        >
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Configuration Form -->
      <div class="p-4 flex-1 overflow-y-auto space-y-5 text-sm">
        <!-- API Key Field -->
        <div>
          <label class="block font-medium text-slate-300 mb-1">API Key</label>
          <div class="relative">
            <input
              type="password"
              id="apiKeyInput"
              placeholder="sk-or-v1-..."
              class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-indigo-500 text-xs pr-8"
            />
            <button
              id="toggleKeyVisibility"
              class="absolute right-2 top-2.5 text-slate-500 hover:text-slate-300"
            >
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
          <p class="text-[11px] text-slate-500 mt-1">
            Key is stored locally in your browser.
          </p>
        </div>

        <!-- Endpoint URL Field -->
        <div>
          <label class="block font-medium text-slate-300 mb-1"
            >API Endpoint URL</label
          >
          <input
            type="text"
            id="endpointInput"
            value="https://openrouter.ai/api/v1/chat/completions"
            class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-indigo-500 text-xs"
          />
        </div>

        <!-- Model Selector -->
        <div>
          <label class="block font-medium text-slate-300 mb-1"
            >Model Name / Slug</label
          >
          <input
            type="text"
            id="modelInput"
            value="meta-llama/llama-3.1-8b-instruct"
            class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 focus:outline-none focus:border-indigo-500 text-xs mb-2"
          />

          <!-- Preset Dropdown -->
          <label class="block text-xs text-slate-400 mb-1"
            >Quick Presets:</label
          >
          <select
            id="presetSelect"
            class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2 py-1.5 text-xs text-slate-300 focus:outline-none focus:border-indigo-500"
          >
            <option value="meta-llama/llama-3.1-8b-instruct">
              Llama 3.1 8B Instruct (Paid)
            </option>
            <option value="google/gemma-2-9b-it:free">Gemma 2 9B (Free)</option>
            <option value="qwen/qwen-2.5-72b-instruct:free">
              Qwen 2.5 72B (Free)
            </option>
            <option value="openai/gpt-4o-mini">GPT-4o Mini</option>
            <option value="anthropic/claude-3.5-sonnet">
              Claude 3.5 Sonnet
            </option>
          </select>
        </div>

        <!-- Temperature Slider -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="font-medium text-slate-300">Temperature</label>
            <span id="tempValue" class="text-xs text-indigo-400 font-mono"
              >0.7</span
            >
          </div>
          <input
            type="range"
            id="tempInput"
            min="0"
            max="2"
            step="0.1"
            value="0.7"
            class="w-full accent-indigo-500 bg-slate-800 h-1.5 rounded-lg appearance-none cursor-pointer"
          />
        </div>

        <!-- System Prompt -->
        <div>
          <label class="block font-medium text-slate-300 mb-1"
            >System Instructions</label
          >
          <textarea
            id="systemPromptInput"
            rows="3"
            placeholder="You are a helpful AI assistant..."
            class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-slate-100 focus:outline-none focus:border-indigo-500 resize-none"
          >
You are a helpful, smart, and concise AI assistant.</textarea
          >
        </div>

        <!-- Action Buttons -->
        <div class="pt-2 border-t border-slate-800 space-y-2">
          <button
            id="saveConfigBtn"
            class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold flex items-center justify-center gap-2 transition"
          >
            <i data-lucide="save" class="w-4 h-4"></i> Save Settings
          </button>
        </div>
      </div>

      <!-- Sidebar Footer -->
      <div
        class="p-3 border-t border-slate-800 text-center text-xs text-slate-500"
      >
        Compatible with OpenRouter & OpenAI format
      </div>
    </aside>

    <!-- Main Chat Workspace -->
    <main
      class="flex-1 flex flex-col h-full bg-slate-950 relative overflow-hidden"
    >
      <!-- Top Header -->
      <header
        class="h-14 border-b border-slate-800 px-4 flex items-center justify-between bg-slate-900/50 backdrop-blur"
      >
        <div class="flex items-center gap-3">
          <button
            id="openSidebarMobile"
            class="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800"
          >
            <i data-lucide="sliders" class="w-5 h-5"></i>
          </button>
          <div>
            <h2
              class="text-sm font-semibold text-slate-200"
              id="currentModelDisplay"
            >
              meta-llama/llama-3.1-8b-instruct
            </h2>
            <div class="flex items-center gap-1.5 text-[11px] text-slate-400">
              <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
              <span id="endpointHostDisplay">openrouter.ai</span>
            </div>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <button
            id="clearChatBtn"
            title="Clear Conversation"
            class="p-2 text-slate-400 hover:text-rose-400 hover:bg-slate-800 rounded-lg transition"
          >
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        </div>
      </header>

      <!-- Chat Messages Scroll Container -->
      <div
        id="chatContainer"
        class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6"
      >
        <!-- Welcome Message / Empty State -->
        <div
          id="emptyState"
          class="h-full flex flex-col items-center justify-center text-center p-6 text-slate-500 space-y-4"
        >
          <div
            class="p-4 bg-slate-900 border border-slate-800 rounded-2xl text-indigo-400"
          >
            <i data-lucide="bot" class="w-10 h-10"></i>
          </div>
          <div class="max-w-md space-y-1">
            <h3 class="text-slate-200 font-semibold text-base">
              Ready to Chat
            </h3>
            <p class="text-xs">
              Configure your API key in settings and ask a question to get
              started.
            </p>
          </div>
        </div>
      </div>

      <!-- Input Box Area -->
      <div class="p-4 border-t border-slate-800 bg-slate-900/40">
        <div class="max-w-4xl mx-auto relative">
          <textarea
            id="userInput"
            rows="1"
            placeholder="Type your message here... (Shift + Enter for new line)"
            class="w-full bg-slate-900 border border-slate-700/80 rounded-xl pl-4 pr-12 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 resize-none max-h-36 shadow-lg"
          ></textarea>

          <button
            id="sendBtn"
            class="absolute right-2.5 bottom-2.5 p-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed"
          >
            <i data-lucide="send" class="w-4 h-4"></i>
          </button>
        </div>
        <div
          class="max-w-4xl mx-auto mt-2 flex justify-between text-[11px] text-slate-500 px-1"
        >
          <span
            >Press
            <kbd class="px-1 bg-slate-800 rounded text-slate-300">Enter</kbd> to
            send</span
          >
          <span id="statusIndicator">Ready</span>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
